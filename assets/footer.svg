<svg xmlns="http://www.w3.org/2000/svg" width="860" height="92" viewBox="0 0 860 92" role="img" aria-label="Obrigado pela visita">
<title>Obrigado pela visita</title>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0c1527"/>
    <stop offset="1" stop-color="#070d19"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1f3355" stroke-width="0.6" opacity="0.45"/>
  </pattern>
  <clipPath id="cardClip"><rect width="860" height="92" rx="14"/></clipPath>
  
