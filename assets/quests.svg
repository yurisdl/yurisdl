<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-label="Linha do tempo: Ciência da Computação na UNIFIN (2019 a 2025), Nation Resources (2020 até hoje), Hype Roleplay (2024 a 2025), TCC e honra ao mérito">
<title>Linha do tempo: Ciência da Computação na UNIFIN (2019 a 2025), Nation Resources (2020 até hoje), Hype Roleplay (2024 a 2025), TCC e honra ao mérito</title>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0c1527"/>
    <stop offset="1" stop-color="#070d19"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1f3355" stroke-width="0.6" opacity="0.45"/>
  </pattern>
  <clipPath id="cardClip"><rect width="860" height="340" rx="14"/></clipPath>
  
  <pattern id="stripes" width="16" height="28" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)">
    <rect width="16" height="28" fill="#fbbf24" fill-opacity=".14"/>
    <rect width="8" height="28" fill="#fbbf24" fill-opacity=".14"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="16 0" dur=".8s" repeatCount="indefinite" additive="sum"/>
  </pattern>
  <linearGradient id="toastShine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fbbf24" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; }
  .sans { font-family: system-ui,-apple-system,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif; }
  .fade { opacity: 0; animation: fadeIn .5s ease-out forwards; }
  .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .grow { opacity: 0; transform-box: fill-box; transform-origin: left center; animation: grow .7s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes grow { from { opacity: 0; transform: scaleX(.05); } to { opacity: 1; transform: scaleX(1); } }
  .toast { opacity: 0; animation: toast .6s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes toast { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
