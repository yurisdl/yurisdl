<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Yuri Lima, desenvolvedor de software full stack com foco em back-end">
<title>Yuri Lima, desenvolvedor de software full stack com foco em back-end</title>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0c1527"/>
    <stop offset="1" stop-color="#070d19"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1f3355" stroke-width="0.6" opacity="0.45"/>
  </pattern>
  <clipPath id="cardClip"><rect width="860" height="330" rx="14"/></clipPath>
  
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/>
    <stop offset=".5" stop-color="#60a5fa"/>
    <stop offset="1" stop-color="#2dd4bf"/>
    <animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#14b8a6" stop-opacity=".35"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".55"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".07"/></linearGradient>
</defs>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; }
  .sans { font-family: system-ui,-apple-system,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif; }
  .fade { opacity: 0; animation: fadeIn .5s ease-out forwards; }
  .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
