<svg xmlns="http://www.w3.org/2000/svg" width="860" height="128" viewBox="0 0 860 128" role="img" aria-label="Destaques: mais de 5 anos de experiência, fundador da Nation Resources em 2020, melhor média entre os formandos, 3 idiomas">
<title>Destaques: mais de 5 anos de experiência, fundador da Nation Resources em 2020, melhor média entre os formandos, 3 idiomas</title>
<defs>
